name: Release

# Pushing a version tag (for example v0.2.0) tests the code, builds the Windows app,
# checks that the built app starts, and publishes it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $v = python -c "import recorder; print(recorder.APP_VERSION)"
          if ("v$v" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match APP_VERSION $v in recorder/__init__.py"
            exit 1
          }
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows app
        run: python tools/build_windows.py
      - name: Check that the built app starts
        shell: pwsh
        run: |
          $p = Start-Process dist/Swaralipi/Swaralipi.exe -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content dist/Swaralipi/smoke-test.log
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Swaralipi-*-windows.zip
          generate_release_notes: true
          body: |
            ### Download
            **Windows:** download `Swaralipi-${{ github.ref_name }}-windows.zip` below, unzip it,
            and double-click `Swaralipi.exe`. No Python needed.

            Windows may say "Windows protected your PC" because the app is new and not
            code-signed. Click **More info**, then **Run anyway**.

            **Linux / macOS:** download the source code and run `./run.sh`.
